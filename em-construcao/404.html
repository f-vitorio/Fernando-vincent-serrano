    :root {
      --purple: #6b277e;
      --purple-dark: #4a1b58;
      --purple-deep: #260d2e;
      --yellow: #ffe84f;
      --wa: #25d366;
      --wa-dark: #14532d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, var(--purple-deep) 0%, var(--purple-dark) 45%, var(--purple) 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 560px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .logo {
      display: inline-block;
      background: var(--purple);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      padding: 10px 16px;
      border-radius: 10px;
      line-height: 1;
    }

    .logo span { color: var(--yellow); }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
      border: 1px solid rgba(255, 232, 79, 0.45);
      border-radius: 999px;
      padding: 6px 14px;
    }

    h1 {
      font-size: clamp(1.9rem, 6vw, 2.75rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .sub {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      max-width: 440px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--wa);
      color: var(--wa-dark);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); }
    .cta:active { transform: translateY(0); }
    .cta:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .cta svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

    footer {
      margin-top: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    footer a { color: rgba(255, 255, 255, 0.85); text-decoration: underline; }
  </style>
