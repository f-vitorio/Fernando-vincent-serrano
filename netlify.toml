[build]
  base = "vicentbox-site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # PROVISORIO: impede indexacao do URL netlify.app enquanto o dominio
    # vicentboxmga.com.br nao estiver apontado. REMOVER esta linha na migracao.
    X-Robots-Tag = "noindex, nofollow"
