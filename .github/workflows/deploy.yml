name: Deploy — VicentBOX site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vicentbox-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vicentbox-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vicentbox-site/dist

  # PUBLICAÇÃO: descomentar este job e habilitar Pages no repo
  # (Settings → Pages → Source: "GitHub Actions").
  # O site ficará em f-vitorio.github.io/Fernando-vincent-serrano/
  # ou no domínio vicentbox.com.br quando o DNS apontar para o GitHub.
